name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: app
          MYSQL_USER: symfony
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usymfony -psecret"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: PHP lint
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        env:
          DATABASE_URL: "mysql://symfony:secret@127.0.0.1:3306/app?serverVersion=8.0"
        run: php bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse
