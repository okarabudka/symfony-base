name: Release

# On a version tag, build the production images and publish them to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>         single container (Nginx + PHP-FPM), used by Kamal
#   ghcr.io/<owner>/<repo>-app     PHP-FPM, used by compose.prod.yaml
#   ghcr.io/<owner>/<repo>-web     Nginx with built assets, used by compose.prod.yaml
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: server
            suffix: ''
          - target: app
            suffix: '-app'
          - target: web
            suffix: '-web'
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Symfony project (template repository only)
        run: make app
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
