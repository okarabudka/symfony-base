services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    environment:
      APP_ENV: prod
      DATABASE_URL: "mysql://${MYSQL_USER:-symfony}:${MYSQL_PASSWORD:-secret}@mysql:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0"
    depends_on:
      mysql:
        condition: service_healthy
    volumes: []

  web:
    ports:
      - "${APP_PORT:-8080}:80"
    volumes: []

  mysql:
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
