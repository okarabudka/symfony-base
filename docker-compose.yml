services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /var/www
    init: true
    volumes:
      - .:/var/www
      - ./docker/php/conf.d/dev:/usr/local/etc/php/conf.d:ro
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://${MYSQL_USER:-symfony}:${MYSQL_PASSWORD:-secret}@mysql:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0"
    depends_on:
      mysql:
        condition: service_healthy
  #      - redis

  web:
    image: nginx:alpine
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-symfony}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-symfony}", "-p${MYSQL_PASSWORD:-secret}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    profiles: ["mail"]
    ports:
      - "${MAILHOG_HTTP_PORT:-8025}:8025" # Web interface MailHog
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP-сервер

  redis:
    image: redis:alpine
    profiles: ["cache"]
    restart: unless-stopped
    init: true
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  node:
    image: node:20-alpine
    profiles: ["node"]
    working_dir: /var/www
    init: true
    volumes:
      - .:/var/www
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  mysql_data:
